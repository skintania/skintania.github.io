<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ลืมรหัสผ่าน - Skintania</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/Assest/sk-cu.png">
  <style>html, body { overflow: hidden; }</style>
</head>

<body>
  <div class="ac-wrap">
    <div class="ac-card">

      <a href="/" class="ac-logo">
        <img src="/Assest/sk-cu.png" alt="Logo">
        <span>Skintania</span>
      </a>

      <div class="ac-icon">🔑</div>
      <h1>ลืมรหัสผ่าน</h1>
      <p class="ac-desc">ระบุอีเมลของคุณ เพื่อรับรหัสยืนยันการตั้งรหัสผ่านใหม่</p>

      <form id="checkUserForm">
        <div class="form-group">
          <label for="identifier">อีเมล</label>
          <input type="email" id="identifier" class="form-control"
            placeholder="example@email.com" required>
        </div>
        <button type="submit" class="auth-btn" id="submitBtn">ถัดไป →</button>
      </form>

      <div class="ac-status" id="statusMsg"></div>

      <div class="ac-footer">
        <a href="/login/" class="auth-link-muted">← กลับไปหน้าเข้าสู่ระบบ</a>
      </div>

    </div>
  </div>

  <script type="module">
    import { CONFIG } from '/config.js';

    const statusMsg = document.getElementById("statusMsg");

    function showStatus(success, html) {
      statusMsg.style.display = "block";
      statusMsg.style.background = success ? "rgba(34,197,94,0.12)" : "rgba(239,68,68,0.12)";
      statusMsg.style.border     = success ? "1px solid rgba(34,197,94,0.3)" : "1px solid rgba(239,68,68,0.3)";
      statusMsg.style.color      = success ? "#4ade80" : "#f87171";
      statusMsg.innerHTML = html;
    }

    document.getElementById("checkUserForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const identifier = document.getElementById("identifier").value.trim();
      const btn = document.getElementById("submitBtn");

      btn.disabled = true;
      btn.innerText = "กำลังตรวจสอบบัญชี...";

      try {
        const response = await fetch(`${CONFIG.API_URL}/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: identifier })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          const emailToReset = result.email || identifier;
          window.location.href = `reset-password.html?email=${encodeURIComponent(emailToReset)}`;
        } else {
          showStatus(false, "✗ " + (result.error || "ไม่พบข้อมูลผู้ใช้"));
          btn.disabled = false;
          btn.innerText = "ถัดไป →";
        }
      } catch {
        showStatus(false, "✗ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่");
        btn.disabled = false;
        btn.innerText = "ถัดไป →";
      }
    });
  </script>

</body>

</html>
