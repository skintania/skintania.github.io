<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ตั้งรหัสผ่านใหม่ - Skintania</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/Assest/sk-cu.png">
  <style>html, body { overflow: hidden; }</style>
</head>

<body>
  <div class="ac-wrap">
    <div class="ac-card">

      <a href="/" class="ac-logo">
        <img src="/Assest/sk-cu.png" alt="Logo">
        <span>Skintania</span>
      </a>

      <div class="ac-icon">🔒</div>
      <h1>ตั้งรหัสผ่านใหม่</h1>
      <p class="ac-desc">
        รหัส OTP ถูกส่งไปที่<br>
        <strong id="targetEmail" style="color:#e6eef8;">---</strong>
      </p>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="otp">รหัส OTP (6 หลัก)</label>
          <input type="text" id="otp" class="form-control otp-input"
            placeholder="000000" maxlength="6" inputmode="numeric" required>
        </div>

        <hr class="ac-divider">

        <div class="form-group">
          <label for="newPassword">รหัสผ่านใหม่ <span style="color:var(--muted);font-size:0.78rem;">(อย่างน้อย 8 ตัว)</span></label>
          <input type="password" id="newPassword" class="form-control"
            placeholder="••••••••" minlength="8" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
          <input type="password" id="confirmPassword" class="form-control"
            placeholder="••••••••" required>
        </div>

        <button type="submit" class="auth-btn" id="saveBtn">ยืนยันการเปลี่ยนรหัสผ่าน</button>
      </form>

      <div class="ac-status" id="statusMsg"></div>

      <div class="ac-footer">
        <p style="font-size:0.78rem;color:var(--muted);text-align:center;margin:0;">
          หากไม่ได้รับอีเมล ลองเช็คใน Junk Mail หรือรอ 1 นาทีแล้วลองใหม่
        </p>
        <a href="/login/" class="auth-link-muted">← กลับไปหน้าเข้าสู่ระบบ</a>
      </div>

    </div>
  </div>

  <script type="module">
    import { CONFIG } from '/config.js';

    document.addEventListener("DOMContentLoaded", () => {
      const email = new URLSearchParams(window.location.search).get('email');

      if (!email) {
        window.location.replace("forgot-password.html");
        return;
      }

      document.getElementById("targetEmail").innerText = email;

      const statusMsg = document.getElementById("statusMsg");

      function showStatus(success, html) {
        statusMsg.style.display = "block";
        statusMsg.style.background = success ? "rgba(34,197,94,0.12)" : "rgba(239,68,68,0.12)";
        statusMsg.style.border     = success ? "1px solid rgba(34,197,94,0.3)" : "1px solid rgba(239,68,68,0.3)";
        statusMsg.style.color      = success ? "#4ade80" : "#f87171";
        statusMsg.innerHTML = html;
      }

      document.getElementById("resetPasswordForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const otp = document.getElementById("otp").value.trim();
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const btn = document.getElementById("saveBtn");

        if (newPassword !== confirmPassword) {
          showStatus(false, "✗ รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน");
          return;
        }

        btn.disabled = true;
        btn.innerText = "กำลังบันทึกรหัสผ่านใหม่...";

        try {
          const response = await fetch(`${CONFIG.API_URL}/auth/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, otp, newPassword })
          });

          const result = await response.json();

          if (response.ok && result.success) {
            document.getElementById("resetPasswordForm").style.display = "none";
            showStatus(true, "✓ เปลี่ยนรหัสผ่านสำเร็จ!<br><span style='font-size:0.85rem;color:#9aa4b2;'>กำลังพาไปหน้าเข้าสู่ระบบใน 3 วินาที...</span>");
            setTimeout(() => window.location.replace("/login/"), 3000);
          } else {
            showStatus(false, "✗ " + (result.error || "ข้อมูลไม่ถูกต้อง"));
            btn.disabled = false;
            btn.innerText = "ยืนยันการเปลี่ยนรหัสผ่าน";
          }
        } catch {
          showStatus(false, "✗ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้");
          btn.disabled = false;
          btn.innerText = "ยืนยันการเปลี่ยนรหัสผ่าน";
        }
      });
    });
  </script>

</body>

</html>
