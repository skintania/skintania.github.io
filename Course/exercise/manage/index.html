<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>จัดการแบบฝึกหัด — Skintania</title>

  <style>body { display: none }</style>

  <script type="module" src="/auth-guard.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/Template/style.css">
  <link rel="stylesheet" href="/Course/exercise/manage/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="icon" href="/Assest/sk-cu.png">

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script type="module" src="/Template/component.js" defer></script>
  <script type="module" src="/Course/exercise/manage/loadManage.js" defer></script>
</head>

<body>
  <comment-widget></comment-widget>

  <main class="wrap">
    <a id="backLink" class="manage-back-link" href="#">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      กลับไปหน้าแบบฝึกหัด
    </a>

    <site-header page-title="จัดการแบบฝึกหัด" page-desc="กำลังโหลด..."></site-header>

    <div class="manage-layout">

      <!-- ── Left: sidebar ── -->
      <aside class="manage-sidebar">

        <!-- Problem sets section -->
        <div class="manage-sidebar-header">
          <span class="manage-sidebar-title">ชุดโจทย์</span>
          <button class="btn-sm" id="addPsBtn">+ เพิ่ม</button>
        </div>
        <ul class="manage-ps-list" id="psList">
          <li class="manage-list-skeleton"></li>
        </ul>

        <div class="manage-sidebar-divider"></div>

        <!-- Exercises section -->
        <div class="manage-sidebar-header">
          <span class="manage-sidebar-title">รายการข้อ</span>
          <span class="manage-exercise-count" id="exerciseCount">0 ข้อ</span>
        </div>

        <ul class="manage-list" id="manageList">
          <li class="manage-list-skeleton"></li>
          <li class="manage-list-skeleton"></li>
          <li class="manage-list-skeleton"></li>
        </ul>

        <button class="btn manage-add-btn" id="addExerciseBtn">+ เพิ่มข้อใหม่</button>
      </aside>

      <!-- ── Right: form panel ── -->
      <div class="manage-form-panel" id="formPanel">

        <!-- Empty state -->
        <div class="form-empty-state" id="formEmptyState">
          <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1" opacity="0.18">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <p>เลือกข้อจากรายการเพื่อแก้ไข<br>หรือกด "+ เพิ่มข้อใหม่"</p>
        </div>

        <!-- Form -->
        <form class="manage-form" id="manageForm" hidden>

          <div class="form-section-header" id="formSectionHeader">สร้างข้อใหม่</div>

          <!-- Title + sort order -->
          <div class="form-row-2">
            <label class="form-label">
              ชื่อข้อ / หัวข้อ <span class="req">*</span>
              <input class="form-input" type="text" id="fTitle" placeholder="เช่น แรงสัมผัส ข้อ 1" required>
            </label>
            <label class="form-label form-label-narrow">
              ลำดับ
              <input class="form-input" type="number" id="fSortOrder" value="0" min="0">
            </label>
          </div>

          <!-- Problem Set -->
          <label class="form-label">
            ชุดโจทย์ <span class="req">*</span>
            <select class="form-input" id="fProblemSet">
              <option value="">-- เลือกชุดโจทย์ --</option>
            </select>
          </label>

          <!-- Type -->
          <label class="form-label">
            ประเภทข้อ <span class="req">*</span>
            <select class="form-input" id="fType">
              <option value="multiple_choice">🔘 ปรนัย (Multiple Choice)</option>
              <option value="fill_blank">✏️ เติมคำ (Fill in the Blank)</option>
              <option value="free_response">📝 อัตนัย (Free Response)</option>
            </select>
          </label>

          <!-- Question (LaTeX) -->
          <label class="form-label">
            โจทย์ <span class="req">*</span>
            <textarea class="form-input form-textarea font-mono" id="fQuestion" rows="5"
              placeholder="ใช้ LaTeX ได้ เช่น&#10;จงหาแรง $F$ เมื่อ $m = 5\ \text{kg}$ และ $a = 3\ \text{ms}^{-2}$&#10;&#10;$$F = ma$$"></textarea>
          </label>
          <div class="latex-preview">
            <span class="latex-preview-label">Preview</span>
            <div class="latex-preview-render" id="renderQuestion"></div>
          </div>

          <!-- ── Choices (multiple_choice) ── -->
          <div id="choicesSection">
            <div class="form-label-row">
              <span class="form-label-text">ตัวเลือก <span class="req">*</span></span>
              <button type="button" class="btn-sm" id="addChoiceBtn">+ เพิ่มตัวเลือก</button>
            </div>
            <div id="choicesList" class="choices-list"></div>

            <label class="form-label" style="margin-top:14px">
              เฉลย — เลือกข้อที่ถูกต้อง
              <span class="form-hint" id="answerHint"></span>
              <div class="answer-radios" id="answerRadios"></div>
            </label>
          </div>

          <!-- ── Answer (fill_blank) ── -->
          <div id="fillAnswerSection">
            <label class="form-label">
              เฉลย <span class="req" id="fillAnswerReq">*</span>
              <input class="form-input" type="text" id="fFillAnswer"
                placeholder="คำตอบที่ถูกต้อง (ตรวจแบบ case-insensitive)">
              <span class="form-hint" id="fillAnswerHint"></span>
            </label>
          </div>

          <div class="form-divider"></div>
          <p class="form-section-label">รูปภาพประกอบโจทย์ <span class="form-hint">(ไม่บังคับ · jpeg / png / webp · ≤ 5 MB)</span></p>
          <div class="img-upload-area" id="imgUploadArea">
            <img class="img-preview" id="imgPreview" hidden>
            <div class="img-upload-placeholder" id="imgPlaceholder">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
                <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <span>ยังไม่มีรูปภาพ</span>
            </div>
            <div class="img-upload-actions">
              <input type="file" id="imgFileInput" accept="image/jpeg,image/png,image/webp" hidden>
              <button type="button" class="btn-sm" id="imgUploadBtn">อัปโหลด</button>
              <button type="button" class="btn-sm img-remove-btn" id="imgRemoveBtn" hidden>ลบรูป</button>
            </div>
            <p class="form-error" id="imgError" hidden></p>
          </div>

          <div class="form-divider"></div>
          <p class="form-section-label">เฉลยแบบละเอียด <span class="form-hint">(แสดงหลังส่งคำตอบ)</span></p>

          <!-- Solution (LaTeX) -->
          <label class="form-label">
            เฉลย
            <textarea class="form-input form-textarea font-mono" id="fSolution" rows="4"
              placeholder="ใช้ LaTeX ได้ เช่น&#10;$$a = \frac{F}{m} = \frac{30}{5} = 6\ \text{ms}^{-2}$$"></textarea>
          </label>
          <div class="latex-preview">
            <span class="latex-preview-label">Preview</span>
            <div class="latex-preview-render" id="renderSolution"></div>
          </div>

          <p class="form-error" id="formError" hidden></p>

          <div class="form-actions">
            <button type="button" class="btn-ghost" id="cancelFormBtn">ยกเลิก</button>
            <button type="submit" class="btn" id="saveBtn">บันทึก</button>
          </div>

        </form>
      </div>

    </div>
  </main>

  <!-- ── Problem Set Modal ── -->
  <div class="ps-modal-overlay" id="psModal" hidden>
    <div class="ps-modal-box">
      <div class="ps-modal-header">
        <h2 class="ps-modal-title" id="psModalTitle">เพิ่มชุดโจทย์</h2>
        <button class="ps-modal-close" id="psModalClose">✕</button>
      </div>
      <form id="psForm">
        <label class="form-label">
          ชื่อชุดโจทย์ <span class="req">*</span>
          <input class="form-input" type="text" id="psTitle" placeholder="เช่น Week 1: Kinematics" required>
        </label>
        <label class="form-label" style="margin-top:14px">
          คำอธิบาย
          <input class="form-input" type="text" id="psDesc" placeholder="ไม่บังคับ">
        </label>
        <label class="form-label" style="margin-top:14px">
          ผู้จัดทำ
          <input class="form-input" type="text" id="psAuthor" placeholder="เช่น Dr. Smith (ค่าเริ่มต้น: Skintania)">
        </label>
        <label class="form-label form-label-narrow" style="margin-top:14px">
          ลำดับ
          <input class="form-input" type="number" id="psSortOrder" value="0" min="0">
        </label>
        <p class="form-error" id="psError" hidden></p>
        <div class="form-actions" style="margin-top:20px">
          <button type="button" class="btn-ghost" id="psCancel">ยกเลิก</button>
          <button type="submit" class="btn" id="psSubmit">บันทึก</button>
        </div>
      </form>
    </div>
  </div>
</body>

</html>
